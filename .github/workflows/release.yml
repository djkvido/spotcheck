name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["packaging/**", ".github/workflows/release.yml", "pyproject.toml", "spotcheck/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the version and the changelog
        run: |
          version="$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('spotcheck/__init__.py').read()).group(1))")"
          test "v$version" = "$GITHUB_REF_NAME"
          python3 packaging/changelog.py notes "$version" > /dev/null

  tests:
    name: Tests
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  ffmpeg:
    name: FFmpeg for ${{ matrix.target }}
    needs: [version, tests]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: ubuntu-24.04
          - target: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: ffmpeg-${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/build_ffmpeg.sh', 'packaging/versions.json') }}
      - name: Install the toolchain
        if: steps.cache.outputs.cache-hit != 'true' && matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake pkg-config nasm libz-mingw-w64-dev
      - name: Install the toolchain
        if: steps.cache.outputs.cache-hit != 'true' && matrix.target == 'macos'
        run: brew install pkgconf
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash packaging/build_ffmpeg.sh ${{ matrix.target }} ffmpeg-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-${{ matrix.target }}
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: ffmpeg
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $version = (Get-Content packaging/versions.json | ConvertFrom-Json).innosetup.version
          choco install innosetup --version $version --allow-downgrade -y --no-progress
      - name: Build the installer
        run: python packaging/build.py windows --ffmpeg ffmpeg-windows --out dist
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "SpotCheck"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait
          & "$dir/runtime/python.exe" -I -m spotcheck --packaged --home (Join-Path $env:RUNNER_TEMP "home") --setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$dir/runtime/python.exe" -I -m spotcheck --packaged --home (Join-Path $env:RUNNER_TEMP "home") --diagnostics --network
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PYTHONUTF8 = "1"
          & "$dir/runtime/python.exe" -I -m spotcheck --packaged --home (Join-Path $env:RUNNER_TEMP "home") --check-playlist "https://open.spotify.com/album/4aawyAB9vmqN3uQ7FjRGTy"
          Write-Host "Playlist load exit code: $LASTEXITCODE (informational)"
          $global:LASTEXITCODE = 0
          & "$dir/tools/ffmpeg.exe" -hide_banner -muxers | Select-String chromaprint
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process "$dir/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-windows
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS app
    needs: ffmpeg
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ffmpeg-macos
          path: ffmpeg-macos
      - name: Build the app
        run: |
          chmod +x ffmpeg-macos/ffmpeg ffmpeg-macos/ffprobe
          python packaging/build.py macos --ffmpeg ffmpeg-macos --out dist
      - name: Mount and check
        run: |
          hdiutil attach dist/*.dmg -mountpoint /Volumes/SpotCheck -nobrowse
          app=/Volumes/SpotCheck/SpotCheck.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/runtime/bin/python3" -I -m spotcheck --packaged --home "$RUNNER_TEMP/home" --setup
          "$app/Contents/Resources/runtime/bin/python3" -I -m spotcheck --packaged --home "$RUNNER_TEMP/home" --diagnostics --network
          "$app/Contents/Resources/runtime/bin/python3" -I -m spotcheck --packaged --home "$RUNNER_TEMP/home" --check-playlist "https://open.spotify.com/album/4aawyAB9vmqN3uQ7FjRGTy" || echo "Playlist load exit code: $? (informational)"
          hdiutil detach /Volumes/SpotCheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
      - name: Collect the release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          cp artifacts/installer-windows/*.exe artifacts/installer-macos/*.dmg release/
          git archive --format=tar.gz --prefix="spotcheck-$version/" -o "release/spotcheck-$version-source.tar.gz" HEAD
          tar -czf "release/spotcheck-$version-ffmpeg-sources.tar.gz" -C artifacts/ffmpeg-windows sources
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/*
      - name: Write the release notes
        run: |
          { python3 packaging/changelog.py notes "${GITHUB_REF_NAME#v}"; echo; cat packaging/release-notes.md; } > notes.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$GITHUB_REF_NAME is already published and is left unchanged"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
              --title "SpotCheck ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
