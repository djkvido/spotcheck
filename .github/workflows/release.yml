name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["packaging/**", ".github/workflows/release.yml", "pyproject.toml", "spotcheck/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ffmpeg:
    name: FFmpeg for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: ubuntu-24.04
          - target: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        id: cache
        with:
          path: ffmpeg-${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/build_ffmpeg.sh', 'packaging/versions.json') }}
      - name: Install the toolchain
        if: steps.cache.outputs.cache-hit != 'true' && matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake pkg-config nasm libz-mingw-w64-dev
      - name: Install the toolchain
        if: steps.cache.outputs.cache-hit != 'true' && matrix.target == 'macos'
        run: brew install pkgconf
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash packaging/build_ffmpeg.sh ${{ matrix.target }} ffmpeg-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-${{ matrix.target }}
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: ffmpeg
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $version = (Get-Content packaging/versions.json | ConvertFrom-Json).innosetup.version
          choco install innosetup --version $version --allow-downgrade -y --no-progress
      - name: Build the installer
        run: python packaging/build.py windows --ffmpeg ffmpeg-windows --out dist
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "SpotCheck"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait
          & "$dir/runtime/python.exe" -I -m spotcheck --packaged --home (Join-Path $env:RUNNER_TEMP "home") --setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$dir/tools/ffmpeg.exe" -hide_banner -muxers | Select-String chromaprint
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process "$dir/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-windows
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS app
    needs: ffmpeg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ffmpeg-macos
          path: ffmpeg-macos
      - name: Build the app
        run: |
          chmod +x ffmpeg-macos/ffmpeg ffmpeg-macos/ffprobe
          python packaging/build.py macos --ffmpeg ffmpeg-macos --out dist
      - name: Mount and check
        run: |
          hdiutil attach dist/*.dmg -mountpoint /Volumes/SpotCheck -nobrowse
          app=/Volumes/SpotCheck/SpotCheck.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/runtime/bin/python3" -I -m spotcheck --packaged --home "$RUNNER_TEMP/home" --setup
          hdiutil detach /Volumes/SpotCheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Check the version
        run: |
          version="$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('spotcheck/__init__.py').read()).group(1))")"
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Collect the release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          cp artifacts/installer-windows/*.exe artifacts/installer-macos/*.dmg release/
          git archive --format=tar.gz --prefix="spotcheck-$version/" -o "release/spotcheck-$version-source.tar.gz" HEAD
          tar -czf "release/spotcheck-$version-ffmpeg-sources.tar.gz" -C artifacts/ffmpeg-windows sources
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "SpotCheck ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md
