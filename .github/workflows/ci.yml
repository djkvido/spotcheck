name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-15
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        timeout-minutes: 10
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check UI scripts
        if: runner.os == 'Linux'
        run: for f in spotcheck/static/*.js; do node --check "$f"; done
      - name: Check the changelog
        if: runner.os == 'Linux'
        run: python packaging/changelog.py notes 1.0.0 > /dev/null
      - name: Test
        run: python -m pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Audit the installed dependencies
        run: python -m pip_audit --skip-editable
      - name: Audit the installer dependencies
        run: |
          python -m pip_audit --disable-pip --require-hashes -r packaging/requirements-windows.lock
          python -m pip_audit --disable-pip --require-hashes -r packaging/requirements-macos.lock
