name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version without the leading v, for example 1.0.3
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.0.3"
            exit 1
          fi
          current="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' spotcheck/__init__.py)"
          newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
          if [ "$VERSION" = "$current" ] || [ "$newest" != "$VERSION" ]; then
            echo "::error::$VERSION is not newer than the current version $current"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::The tag v$VERSION already exists"
            exit 1
          fi
      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 packaging/changelog.py release "$VERSION" "$(date -u +%F)"
          sed -i "s/^__version__ = \".*\"$/__version__ = \"$VERSION\"/" spotcheck/__init__.py
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Start the build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION"
