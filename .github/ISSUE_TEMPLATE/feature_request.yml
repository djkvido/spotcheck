name: Feature request
description: An idea that would make SpotCheck more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing or tedious today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could SpotCheck help?
      description: Your idea of how it could work. Alternatives you considered are welcome too.
